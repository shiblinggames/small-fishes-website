<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to Play — Small Fishes: Seas the Booty</title>
  <meta name="description"
    content="Learn how to play Small Fishes: Seas the Booty. Watch the tutorial, follow step-by-step instructions, and get answers to common questions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Karla:ital,wght@0,300;0,400;0,600;1,300&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5">
  <style>
    /* ── Page shell ── */
    .htp-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Under Construction banner ── */
    .under-construction {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 6rem;
      gap: 1.5rem;
    }

    .uc-icon {
      font-size: 2rem;
      letter-spacing: 0.2em;
      color: var(--gold);
      opacity: 0.7;
    }

    .uc-label {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .uc-heading {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 5vw, 4.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .uc-body {
      font-family: var(--font-body);
      font-size: clamp(0.9rem, 1.3vw, 1rem);
      font-weight: 300;
      line-height: 1.7;
      color: rgba(240, 237, 232, 0.55);
      max-width: 36ch;
    }

    .uc-divider {
      width: 2rem;
      height: 1px;
      background: rgba(240, 192, 64, 0.3);
    }

    .uc-back {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: rgba(240, 237, 232, 0.5);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s, border-color 0.2s;
      margin-top: 0.5rem;
    }

    .uc-back:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    /* ── Footer ── */
    .htp-footer {
      border-top: 1px solid rgba(255,255,255,0.06);
      padding: 2rem 8vw;
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
    }
  </style>
</head>

<body>

  <!-- FIXED HEADER -->
  <header class="site-header">
    <nav>

        target="_blank" rel="noopener">Buy the Game</a>
    </nav>
  </header>

  <div class="htp-page">

    <main class="under-construction">
      <span class="uc-label">How to Play &amp; FAQ</span>
      <div class="uc-icon">✦ ✦ ✦</div>
      <h1 class="uc-heading">Coming<br>Soon.</h1>
      <div class="uc-divider"></div>
      <p class="uc-body">We're putting together a full tutorial, step-by-step guides, and a FAQ. Check back soon.</p>
      <a href="/" class="uc-back">← Back to the game</a>
    </main>

    <footer class="htp-footer">
      <span>© 2026 Shibling Games &nbsp;·&nbsp; Small Fishes: Seas the Booty</span>
    </footer>

  </div>

</body>

</html>
